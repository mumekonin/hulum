name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:shared
      - run: npm run typecheck:server
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:server
      - run: npm run build
      - run: npm test
