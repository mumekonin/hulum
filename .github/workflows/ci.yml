# Install, typecheck, lint, test, and production builds. No deploy (local only).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hulum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hulum_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hulum_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      # Windows-generated lockfiles list Linux optionals, but npm's os/cpu/libc
      # filter can still skip them on the runner. Force without rewriting the lockfile.
      - name: Ensure Linux native CSS bindings
        run: |
          npm install --no-save --no-package-lock --include=optional \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            lightningcss-linux-x64-gnu@1.32.0 \
            @rollup/rollup-linux-x64-gnu@4.63.3

      - name: Verify native build dependencies
        run: |
          test -d node_modules/@tailwindcss/oxide-linux-x64-gnu
          test -d node_modules/lightningcss-linux-x64-gnu
          node -e "require('lightningcss'); console.log('lightningcss loaded')"
          node -e "require('@tailwindcss/oxide'); console.log('tailwind oxide loaded')"

      - name: Run database migrations
        run: npm run db:migrate --workspace @hulum/server

      - name: Typecheck shared contracts
        run: npm run typecheck:shared

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Local API smoke (health + register + catalog)
        run: |
          npm run start -w @hulum/server > /tmp/hulum-api.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "API did not become healthy"
            cat /tmp/hulum-api.log || true
            exit 1
          fi
          npm run smoke:local
        env:
          API_URL: http://127.0.0.1:3001

      - name: Build server
        run: npm run build:server

      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke (welcome → register → onboarding → Ask HULUM)
        run: |
          if ! curl -sf http://127.0.0.1:3001/api/health >/dev/null; then
            npm run start -w @hulum/server > /tmp/hulum-api.log 2>&1 &
            for i in $(seq 1 40); do
              curl -sf http://127.0.0.1:3001/api/health >/dev/null && break
              sleep 1
            done
          fi
          curl -sf http://127.0.0.1:3001/api/health
          npm run start -w @hulum/web > /tmp/hulum-web.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Web did not become ready"
            cat /tmp/hulum-web.log || true
            cat /tmp/hulum-api.log || true
            exit 1
          fi
          npm run smoke:browser
        env:
          WEB_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
