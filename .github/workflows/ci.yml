# Install, typecheck, lint, test, and production builds. No deploy (local only).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hulum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hulum_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hulum_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify native build dependencies
        run: |
          node -e "require('lightningcss'); console.log('lightningcss loaded')"

      - name: Run database migrations
        run: npm run db:migrate --workspace @hulum/server

      - name: Typecheck shared contracts
        run: npm run typecheck:shared

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build server
        run: npm run build:server

      - name: Build web
        run: npm run build
